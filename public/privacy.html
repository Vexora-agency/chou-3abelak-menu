<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="robots" content="index,follow" />
  <title>Privacy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>:root{--black:#0A0A0A;--yellow:#FFC400;--bg:#FFFFFF;--fg:#0A0A0A;--mut:#5A5A5A;--card:#F7F7F7;--line:#E6E6E6}
[data-theme="dark"]{--bg:#0A0A0A;--fg:#FFFFFF;--mut:#BDBDBD;--card:#141414;--line:#262626}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Poppins',system-ui,sans-serif;line-height:1.6;transition:background .3s,color .3s}
[dir="rtl"] body,body[dir="rtl"]{font-family:'Cairo','Poppins',system-ui,sans-serif}
a{color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.hero{position:relative;isolation:isolate;overflow:hidden;background:var(--black);color:#fff;border-radius:0 0 32px 32px;padding:16px 20px 44px;text-align:center}
.spot{position:absolute;inset:-12% -10% 0;pointer-events:none;background:radial-gradient(52% 58% at 50% 40%,rgba(255,196,0,.2),rgba(255,196,0,.06) 46%,transparent 74%);animation:breathe 7s ease-in-out infinite alternate;z-index:-1}
.edge{position:absolute;left:0;right:0;bottom:0;height:3px;overflow:hidden;background:linear-gradient(90deg,transparent,#FFC400 18%,#FFE07A 50%,#FFC400 82%,transparent)}
.edge::after{content:"";position:absolute;inset:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);animation:sweep 4.8s ease-in-out infinite}
.edge.top{bottom:auto;top:0}
.bar{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:760px;margin:0 auto}
.pill{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);color:#fff;text-decoration:none;font-size:14px;font-weight:600}
.pill.lang{padding:4px;gap:2px}
.lang button{min-width:48px;height:36px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.75);font:700 12px inherit;font-family:inherit;cursor:pointer;transition:background .25s,color .25s}
.lang button[aria-pressed="true"]{background:var(--yellow);color:var(--black)}
.brand{position:relative;margin-top:18px;animation:rise .7s both}
.logo{display:block;margin:0 auto;width:180px;height:auto}
h1{margin:14px 0 4px;font-size:30px;font-weight:800;letter-spacing:.5px}
.sub{margin:0 auto;max-width:520px;color:rgba(255,255,255,.75);font-size:14px}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 24px;display:grid;gap:14px}
.card{display:flex;gap:16px;padding:20px;border-radius:22px;background:var(--card);border:1px solid var(--line);opacity:0;transform:translateY(18px);transition:opacity .6s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1),border-color .25s}
.card.in{opacity:1;transform:none}
.card:hover{border-color:var(--yellow)}
.ic{flex:none;width:44px;height:44px;border-radius:14px;background:var(--yellow);display:flex;align-items:center;justify-content:center}
.ic svg{width:22px;height:22px;fill:none;stroke:var(--black);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
h2{margin:0 0 8px;font-size:17px;font-weight:800}
ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
li{position:relative;padding-inline-start:18px;color:var(--mut);font-size:14px}
li::before{content:"";position:absolute;inset-inline-start:0;top:.65em;width:7px;height:7px;border-radius:50%;background:var(--yellow)}
p{margin:0;color:var(--mut);font-size:14px;white-space:pre-line}
.contact{padding:26px 20px;border-radius:24px;background:var(--black);color:#fff;text-align:center;opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}
.contact.in{opacity:1;transform:none}
.contact h2{color:var(--yellow)}
.contact p{color:rgba(255,255,255,.8);margin-bottom:16px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;font-weight:700;font-size:14px;text-decoration:none;transition:scale .22s cubic-bezier(.34,1.56,.64,1)}
.btn:hover{scale:1.04}.btn:active{scale:.95}
.btn.solid{background:var(--yellow);color:var(--black)}
.btn.ghost{border:1.5px solid rgba(255,196,0,.6);color:var(--yellow)}
[hidden]{display:none!important}
.foot{position:relative;background:var(--black);color:#BDBDBD;text-align:center;font-size:12px;padding:26px 16px 22px;margin-top:30px;border-radius:32px 32px 0 0}
.foot p{color:#BDBDBD;margin:0}
@keyframes breathe{from{opacity:.72;transform:scale(1)}to{opacity:1;transform:scale(1.06)}}
@keyframes sweep{from{transform:translateX(-120%)}to{transform:translateX(420%)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card,.contact{opacity:1;transform:none}}
@media (max-width:480px){.card{padding:16px;gap:12px}h1{font-size:26px}}
</style>
</head>

    <section class="card" data-sec="rights"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span><div><h2 data-i18n="rightsT"></h2><ul data-list="rightsL"></ul></div></section>
    <section class="card" data-sec="extra" id="extra" hidden><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v4M12 16h.01"/><circle cx="12" cy="12" r="10"/></svg></span><div><h2 data-i18n="extraT"></h2><p id="extraP"></p></div></section>

    <section class="contact" data-sec="contact">
      <h2 data-i18n="contactT"></h2>
      <p id="contactName"></p>
      <div class="actions"><a class="btn ghost" id="callBtn" hidden></a><a class="btn solid" id="waBtn" target="_blank" rel="noopener noreferrer" hidden></a></div>
    </section>
  </main>

  <footer class="foot"><div class="edge top" aria-hidden="true"></div><p id="year"></p></footer>
<script>(function () {
  'use strict';
  var STR = {
    en: {
      back: 'Back to menu', title: 'Privacy', sub: 'How {name} handles your information when you order.',
      collectT: 'What we collect', collectL: ['Your name and phone number, so we can confirm and deliver your order.', 'Your delivery address, and your location only if you choose to share it.', 'What you ordered, the total and the time of the order.', 'Any note for the place.', 'Your email address, only if you choose to add it so order updates reach you.'],
      whyT: 'Why we use it', whyL: ['To prepare, confirm and deliver your order.', 'To contact you about that order if needed.', 'To produce anonymous statistics, such as how many orders we receive. These never include your name, phone or address.'],
      storeT: 'How it is sent and stored', storeSent: 'When you tap Send, your order is recorded in the place\u2019s account so the staff can prepare it, and the staff get an instant notification.',
      storeSaved: 'A copy of the order is stored on the place\u2019s account at Cloudflare, our hosting provider. Only the place\u2019s staff can see it.', storeNone: 'This website does not store your order. It is only sent to the place to be prepared.',
      keepT: 'How long we keep it', keepPii: 'Your name, phone, email (if added), address, location and notes are removed {piiDays} days after the order.', keepRec: 'Anonymous order records (items and totals only) are kept for up to {orderMonths} months for statistics.', keepNone: 'Nothing is kept on this website after you leave it.',
      deviceT: 'On your device', deviceL: ['We store your cart, language and theme choice in your browser so the site works as you expect.', 'We do not use advertising or tracking cookies.'],
      thirdT: 'Other services', thirdL: ['Cloudflare hosts this website.', 'Google Fonts delivers the text fonts.', 'Telegram delivers instant order notifications to the place\u2019s staff.', 'Resend delivers the order emails you opt into.', 'Sentry reports app errors (technical data only, no order details).'],
      rightsT: 'Your choices', rightsL: ['You can ask the place to delete or anonymize your order details, or to give you a copy of them.', 'Contact us using the details below and mention the phone number you used.'],
      extraT: 'Notes from the place', contactT: 'Contact the place', call: 'Call', wa: 'WhatsApp', year: '\u00a9 {year} {name}',
    },
    ar: {
      back: 'العودة إلى القائمة', title: 'الخصوصية', sub: 'كيف يتعامل {name} مع معلوماتك عند الطلب.',
      collectT: 'ما الذي نجمعه', collectL: ['اسمك ورقم هاتفك، لنؤكد طلبك ونوصله إليك.', 'عنوان التوصيل، وموقعك فقط إذا اخترت مشاركته.', 'ما طلبته والإجمالي ووقت الطلب.', 'أي ملاحظة تكتبها للمكان.', 'بريدك الإلكتروني، فقط إذا اخترت إضافته لتصلك تحديثات الطلب.'],
      whyT: 'لماذا نستخدمها', whyL: ['لتجهيز طلبك وتأكيده وتوصيله.', 'للتواصل معك بخصوص هذا الطلب عند الحاجة.', 'لإعداد إحصائيات مجهولة الهوية، مثل عدد الطلبات التي نستقبلها. ولا تحتوي أبدًا على اسمك أو هاتفك أو عنوانك.'],
      storeT: 'كيف تُرسل وتُخزَّن', storeSent: 'عندما تضغط زر إرسال، يُسجَّل طلبك في حساب المتجر ليتولى فريق العمل تجهيزه، ويصلهم إشعار فوري.',
      storeSaved: 'تُخزَّن نسخة من الطلب في حساب المتجر لدى Cloudflare، مزوّد الاستضافة لدينا. ولا يراها إلا فريق العمل.', storeNone: 'لا يخزّن هذا الموقع طلبك. يُرسل فقط إلى المتجر لتجهيزه.',
      keepT: 'كم من الوقت نحتفظ بها', keepPii: 'يُحذف اسمك وهاتفك وبريدك (إن أضفته) وعنوانك وموقعك وملاحظاتك بعد {piiDays} يومًا من الطلب.', keepRec: 'تُحفظ سجلات الطلبات مجهولة الهوية (الأصناف والإجماليات فقط) حتى {orderMonths} شهرًا للإحصائيات.', keepNone: 'لا يُحفظ شيء في هذا الموقع بعد مغادرتك له.',
      deviceT: 'على جهازك', deviceL: ['نخزّن سلتك واللغة والسمة التي اخترتها في متصفحك ليعمل الموقع كما هو متوقع.', 'لا نستخدم ملفات تعريف الارتباط للإعلانات أو التتبع.'],
      thirdT: 'خدمات أخرى', thirdL: ['تستضيف Cloudflare هذا الموقع.', 'تقدّم Google Fonts خطوط النصوص.', 'يرسل Telegram إشعارات فورية بالطلبات إلى فريق العمل.', 'ترسل Resend رسائل البريد بالطلبات التي تشترك فيها.', 'يبلّغ Sentry بالأخطاء التقنية (بيانات تقنية فقط، دون تفاصيل الطلبات).'],
      rightsT: 'خياراتك', rightsL: ['يمكنك أن تطلب من المتجر حذف بيانات طلبك أو إخفاء هويتها، أو تزويدك بنسخة منها.', 'تواصل معنا عبر البيانات أدناه واذكر رقم الهاتف الذي استخدمته.'],
      extraT: 'ملاحظات من المتجر', contactT: 'تواصل مع المتجر', call: 'اتصال', wa: 'واتساب', year: '\u00a9 {year} {name}',
    },
  };
  var info = { piiDays: 90, orderMonths: 13, hasOrderRecords: true };
  var menu = null;
  var lang = (function () { try { return localStorage.getItem('menu_lang_v1') === 'ar' ? 'ar' : 'en'; } catch (e) { return 'en'; } })();
  try { if (localStorage.getItem('menu_theme_v1') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) { /* ignore */ }

  function $(s) { return document.querySelector(s); }
  function fill(s, v) { return String(s).replace(/\{(\w+)\}/g, function (_, k) { return v[k] !== undefined ? v[k] : ''; }); }
  function restaurantName() { var n = menu && menu.settings && menu.settings.name; return (n && (n[lang] || n.en)) || (lang === 'ar' ? 'المتجر' : 'the place'); }
  function digits(s) { return String(s || '').replace(/\D/g, ''); }
  function setList(el, items) { el.textContent = ''; items.forEach(function (t) { var li = document.createElement('li'); li.textContent = t; el.appendChild(li); }); }

  function render() {
    var t = STR[lang], vals = { name: restaurantName(), piiDays: info.piiDays, orderMonths: info.orderMonths, year: new Date().getFullYear() };
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'; document.body.setAttribute('dir', document.documentElement.dir);
    document.title = t.title + ' | ' + vals.name;
    document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = fill(t[el.getAttribute('data-i18n')], vals); });
    document.querySelectorAll('[data-list]').forEach(function (el) { setList(el, t[el.getAttribute('data-list')].map(function (x) { return fill(x, vals); })); });
    $('#sub').textContent = fill(t.sub, vals);
    setList($('#storeL'), [t.storeSent].concat(info.hasOrderRecords ? [t.storeSaved] : [t.storeNone]));
    setList($('#keepL'), info.hasOrderRecords ? [fill(t.keepPii, vals), fill(t.keepRec, vals)] : [t.keepNone]);
    var extra = menu && menu.settings && menu.settings.privacy && menu.settings.privacy.extra;
    var txt = extra && (extra[lang] || extra.en);
    var sec = $('#extra'); if (txt) { $('#extraP').textContent = String(txt).slice(0, 1000); sec.hidden = false; } else { sec.hidden = true; }
    $('#contactName').textContent = vals.name;
    var phone = digits(menu && menu.settings && menu.settings.phone), wa = digits(menu && menu.settings && menu.settings.whatsapp);
    var call = $('#callBtn'), wab = $('#waBtn');
    if (phone) { call.href = 'tel:+' + phone; call.textContent = t.call + ' +' + phone; call.hidden = false; } else call.hidden = true;
    if (wa) { wab.href = 'https://wa.me/' + wa; wab.textContent = t.wa; wab.hidden = false; } else wab.hidden = true;
    $('#year').textContent = fill(t.year, vals);
    document.querySelectorAll('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang)); });
  }

  function get(url) { return fetch(url, { headers: { Accept: 'application/json' } }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); }
  document.querySelectorAll('[data-lang]').forEach(function (b) { b.addEventListener('click', function () { lang = b.getAttribute('data-lang') === 'ar' ? 'ar' : 'en'; try { localStorage.setItem('menu_lang_v1', lang); } catch (e) { /* ignore */ } render(); }); });

  render();
  Promise.all([get('/api/menu'), get('/api/privacy-info')]).then(function (r) {
    if (r[0] && r[0].settings) menu = r[0];
    if (r[1] && typeof r[1] === 'object') { ['piiDays', 'orderMonths'].forEach(function (k) { var n = Number(r[1][k]); if (isFinite(n) && n > 0) info[k] = Math.round(n); }); if (typeof r[1].hasOrderRecords === 'boolean') info.hasOrderRecords = r[1].hasOrderRecords; }
    render();
  });

  var io = 'IntersectionObserver' in window ? new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }); }, { rootMargin: '0px 0px -8% 0px' }) : null;
  document.querySelectorAll('.card,.contact').forEach(function (el) { if (io) io.observe(el); else el.classList.add('in'); });
})();
</script>
</body>
