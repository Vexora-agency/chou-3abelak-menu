<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Chou 3abelak - Menu</title>
    <meta name="description" content="Chou 3abelak (شو عبالك) - Fresh, Fast, Delicious. Browse the menu with direct WhatsApp ordering." />
    <meta property="og:title" content="Chou 3abelak - Menu" />
    <meta property="og:description" content="Fresh · Fast · Delicious. Browse the menu with direct WhatsApp ordering." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Installable web app (order tracking + push notifications): no caching
         in the worker (public/sw.js is push-only), these tags only enable
         Add to Home Screen — required for iOS notifications. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/pan-icon-yellow.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Chou 3abelak" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Fonts are self-hosted (Fontsource, imported in src/index.css): no
         third-party font requests, nothing render-blocking here. -->

    <!-- LCP logo is injected by React, so the preload scanner can't see it:
         hint it here (same candidates + same sizes as the img) so it
         downloads at high priority instead of waiting for the render. -->
    <link
      rel="preload"
      as="image"
      imagesrcset="/assets/logo-final-480.webp 480w, /assets/logo-final-880.webp 880w, /assets/logo-final-1440.webp 1440w"
      imagesizes="(max-width: 360px) calc(100vw - 40px), (max-width: 640px) 320px, (max-width: 768px) 380px, 440px"
      fetchpriority="high"
    />
    <!-- Intro sheet 0 (66 kB): the engine starts the 6 s reveal the moment
         this arrives; sheets 1-3 stream in during playback. Without this hint
         the sheet waits behind React render + menu fetch. -->
    <link rel="preload" as="image" href="/assets/intro-sheet-0.webp" fetchpriority="high" />
    <!-- Warm-visit LCP head-start: the cached menu already names tonight's
         first featured photo. Preloading it here (before the bundle even
         parses) lets it download in parallel with the JS instead of waiting
         for React render + menu state. No-op on first visits (no cache) and
         byte-identical to what <SmartMenuImage> would pick (same srcset). -->
    <script>
      try {
        var __m = JSON.parse(localStorage.getItem('menu_cache_v3') || 'null');
        var __it = __m && __m.items ? __m.items.filter(function (x) { return x.featured && x.imageUrl; })[0] : null;
        var __v = (__it && __it.imageVariants) || {};
        if (__it && __it.imageUrl && (__v.s || __v.m)) {
          var __ss = [];
          if (__v.s) __ss.push(__v.s + ' 400w');
          if (__v.m) __ss.push(__v.m + ' 800w');
          __ss.push(__it.imageUrl + ' 1280w');
          var __l = document.createElement('link');
          __l.rel = 'preload'; __l.as = 'image';
          __l.setAttribute('imagesrcset', __ss.join(', '));
          __l.setAttribute('imagesizes', '(max-width: 767px) 90vw, (max-width: 1279px) 31vw, 395px');
          try { __l.fetchPriority = 'high'; } catch (e) {}
          document.head.appendChild(__l);
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#0A0A0A] text-[#0A0A0A] antialiased m-0 p-0 selection:bg-[var(--primary)] selection:text-[#0A0A0A]">
    <div id="root"></div>
    <!-- Instant boot splash (pure HTML/CSS, zero JS): paints before the
         bundle even downloads, so a cold start from the Home Screen icon
         shows the brand instead of white. React removes it on first paint. -->
    <div id="boot-splash" style="position:fixed;inset:0;z-index:9999;background:#0A0A0A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;">
      <img
        src="/assets/logo-final-480.webp"
        srcset="/assets/logo-final-480.webp 480w, /assets/logo-final-880.webp 880w, /assets/logo-final-1440.webp 1440w"
        sizes="(max-width: 360px) calc(100vw - 40px), (max-width: 640px) 320px, (max-width: 768px) 380px, 440px"
        alt=""
        width="220"
        height="81"
        style="width:200px;height:auto;animation:boot-pulse 1.4s ease-in-out infinite;"
      />
      <style>@keyframes boot-pulse{0%,100%{opacity:1}50%{opacity:.55}}</style>
    </div>
    <!-- Dead-bundle guard: if the JS never mounts (stale cached HTML pointing
         at a purged asset, or a blocked download), the splash would sit black
         forever. React always paints instantly now, so an empty #root after
         10 s means the bundle is dead — reload once to fetch a fresh copy. -->
    <script>
      setTimeout(function () {
        try {
          var root = document.getElementById('root');
          if (root && root.childNodes.length === 0 && !sessionStorage.getItem('boot-retry')) {
            sessionStorage.setItem('boot-retry', '1');
            location.reload();
          }
        } catch (e) {}
      }, 10000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
