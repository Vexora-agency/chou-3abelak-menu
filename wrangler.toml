# Local tooling only: lets `wrangler d1 ... --local` resolve the ORDERS_DB
# binding and `wrangler pages dev` resolve local bindings for migrations.
# Production Pages deploys are configured in the Cloudflare dashboard
# (git integration ignores this file), so this file never affects
# production. Do NOT put secrets here.
compatibility_date = "2025-06-01"
# Required by @sentry/cloudflare (AsyncLocalStorage). Local tooling only —
# production Pages deploys are configured in the Cloudflare dashboard
# (git integration ignores this file), so mirror this flag there too:
# Pages project -> Settings -> Functions -> Compatibility flags: nodejs_compat.
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "ORDERS_DB"
database_name = "chou-3abelak-orders"
# Placeholder: only used for --remote runs against a real database created
# with `wrangler d1 create`. Local runs (--local) ignore this id.
database_id = "7d585e65-5bea-4b81-b727-ebb001bc72e6"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "MENU_KV"
# Placeholder id for local runs only (--local / pages dev). Production uses
# the real namespace bound in the Cloudflare dashboard.
id = "00000000000000000000000000000000"

[[r2_buckets]]
binding = "REPORTS"
# Monthly report CSVs live under reports/<YYYY-MM>.csv. Local runs use a
# throwaway bucket; production binds the real bucket (created once with
# `wrangler r2 bucket create chou-3abelak-reports`) in the dashboard.
bucket_name = "chou-3abelak-reports"

[[r2_buckets]]
binding = "MENU_IMAGES"
# Admin-uploaded menu photos (menu/<YYYY>/<MM>/<uuid>.<ext>). Created once
# with `wrangler r2 bucket create chou-3abelak-images`; the Pages dashboard
# binds the same bucket name for production. Images are only ever served
# through /api/images/... — the bucket itself stays private.
bucket_name = "chou-3abelak-images"

# Preview (staging) overrides: separate resources so preview deployments
# can NEVER touch production data. See docs/STAGING.md. The dashboard
# Preview-tab bindings are the operational source of truth; this block
# documents the same mapping for CLI deploys and records intent in git.
# Create once per account, then fill in the real ids (also dashboard).
[[env.preview.d1_databases]]
binding = "ORDERS_DB"
database_name = "chou-3abelak-orders-preview"
database_id = "9011d17f-5f1c-436a-bd2b-3e04ef566709"
migrations_dir = "migrations"

[[env.preview.kv_namespaces]]
binding = "MENU_KV"
id = "d4ef20c571854ba69e118e79c903fe6e"

[[env.preview.r2_buckets]]
binding = "REPORTS"
bucket_name = "chou-3abelak-reports-preview"

[[env.preview.r2_buckets]]
binding = "MENU_IMAGES"
bucket_name = "chou-3abelak-images-preview"
