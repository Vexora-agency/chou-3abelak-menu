<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Chou 3abelak - Menu</title>
    <meta name="description" content="Chou 3abelak (شو عبالك) - Fresh, Fast, Delicious. Browse our manakish, pastries, pizza, pies and drinks with direct WhatsApp ordering." />
    <meta property="og:title" content="Chou 3abelak - Menu" />
    <meta property="og:description" content="Fresh · Fast · Delicious. Manakish, pastries, pizza, pies and beverages." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts are self-hosted (Fontsource, imported in src/index.css): no
         third-party font requests, nothing render-blocking here. -->

    <!-- LCP logo is injected by React after the menu loads, so the preload
         scanner can't see it: hint it here (same candidates as the img) so it
         downloads at high priority instead of waiting for the render. -->
    <link
      rel="preload"
      as="image"
      imagesrcset="/assets/logo-final-480.webp 480w, /assets/logo-final-880.webp 880w, /assets/logo-final-1440.webp 1440w"
      imagesizes="(max-width: 640px) 320px, (max-width: 768px) 380px, 440px"
      fetchpriority="high"
    />
    <!-- Intro sheet 0 (66 kB): the engine starts the 6 s reveal the moment
         this arrives; sheets 1-3 stream in during playback. Without this hint
         the sheet waits behind React render + menu fetch. -->
    <link rel="preload" as="image" href="/assets/intro-sheet-0.webp" fetchpriority="high" />
  </head>
  <body class="bg-[#0A0A0A] text-[#0A0A0A] antialiased m-0 p-0 selection:bg-[var(--primary)] selection:text-[#0A0A0A]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
